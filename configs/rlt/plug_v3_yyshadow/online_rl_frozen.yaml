experiment:
  rl:
    action_dim: 7
    chunk_len: 10
    z_dim: 2048
    proprio_dim: 7
    action_representation: delta_chunk
    action_norm_stats_path: /media/agilex/Getea1/jiaan/model/rl-platform/rlt/plug_insertion/online/action_norm_stats.json

    gamma: 0.99
    fixed_std: 0.002
    reference_dropout_prob: 0.5
    delta_weight: 10.0
    warmup_bc_weight: 10.0
    warmup_q_weight: 0.1
    online_bc_weight: 5.0
    online_q_weight: 0.1

    actor_hidden_dim: 256
    actor_num_layers: 2
    critic_hidden_dim: 256
    critic_num_layers: 2
    actor_lr: 0.0001
    critic_lr: 0.0001
    target_tau: 0.005
    actor_update_period: 2

    warmup_min_size: 600
    warmup_post_collect_updates: 5000
    freeze_after_warmup: true
    grad_updates_per_cycle: 5

runtime:
  role: all
  local_debug_mode: false

  monitoring:
    enable_wandb: false
    wandb_project: cobot-rlt-online
    wandb_entity: null
    wandb_mode: offline
    wandb_run_name: plug-v3-yyshadow
    wandb_dir: ../../../outputs/rlt/plug_v3_yyshadow/online/wandb

  actor_service:
    pull_params_interval_sec: 0.25
    rpc_timeout_sec: 0.2
    bind_host: 127.0.0.1
    port: 9131
    snapshot_path: /media/agilex/Getea1/jiaan/model/rl-platform/rlt/plug_insertion/online/actor_snapshot/actor_snapshot.pkl
    xla_mem_fraction: 0.05
    xla_preallocate: false

  learner_service:
    push_actor_interval_steps: 500
    checkpoint_interval_steps: 1000
    sample_batch_size: 128
    checkpoint_dir: /media/agilex/Getea1/jiaan/model/rl-platform/rlt/plug_insertion/online/checkpoints
    actor_snapshot_path: /media/agilex/Getea1/jiaan/model/rl-platform/rlt/plug_insertion/online/actor_snapshot/actor_snapshot.pkl
    replay_url: http://127.0.0.1:9132
    poll_interval_sec: 0.01
    xla_mem_fraction: 0.20
    xla_preallocate: false

  replay:
    capacity: 200000
    journal_path: /media/agilex/Getea1/jiaan/data/datasets/plug_insertion/derived/rl-platform/rlt/replay_clean_v1/replay_journal.pkl
    bind_host: 127.0.0.1
    port: 9132
    seed: 42

  env_driver:
    machine_a_ws_url: ws://127.0.0.1:8030
    actor_service_url: http://127.0.0.1:9131
    replay_service_url: http://127.0.0.1:9132
    task_mode: critical_phase
    episode_start_control_mode: policy
    full_task_reset_action: null
    critical_phase_reset_action: null
    actor_deterministic: false
    chunk_exec_horizon: 10
    control_frequency_hz: 20.0
    step_trace_stride: 0
    replay_feature_batch_size: 16
    enable_human_override: false
    safe_fallback_to_ref: true
    machine_a_connect_timeout_sec: 5.0
    machine_a_recv_timeout_sec: 5.0
    machine_a_retry_interval_sec: 0.5
    actor_request_timeout_sec: 2.0
    replay_request_timeout_sec: 30.0
